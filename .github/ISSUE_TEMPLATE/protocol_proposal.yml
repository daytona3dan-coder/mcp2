name: Protocol proposal
description: Propose a scoped MCP2 semantic, conformance, or evidence improvement.
title: "[Proposal]: "
body:
  - type: markdown
    attributes:
      value: |
        Read [CONTRIBUTING.md](https://github.com/daytona3dan-coder/mcp2/blob/main/CONTRIBUTING.md). Frozen Candidates and closed evidence remain preserved; a proposal is not an adopted protocol change. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem and use case
      description: What concrete limitation or ambiguity does this address?
    validations:
      required: true
  - type: input
    id: scope
    attributes:
      label: Affected version, profile, and sections
      description: Identify normative text, schemas, algorithms, or examples involved.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Explain the intended behavior and its boundaries.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Authority and compatibility impact
      description: Address existing implementations, denial behavior, delegation, revocation, evidence, and versioning as applicable. State what remains unknown.
    validations:
      required: true
  - type: textarea
    id: qualification
    attributes:
      label: Verification plan
      description: Proposed positive and negative vectors, independent checks, and evidence needed to qualify the change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and AI assistance
      description: Alternatives considered, related work, and any AI assistance and how its output was checked.
