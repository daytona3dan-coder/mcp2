name: Repair source evidence
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked public protocol source
        run: |
          mkdir -p repair-evidence
          git archive --format=zip HEAD -o repair-evidence/source.zip
          git rev-parse HEAD > repair-evidence/checkout.txt
      - uses: actions/upload-artifact@v4
        with:
          name: repair-source-${{ github.sha }}
          path: repair-evidence/
          retention-days: 7
