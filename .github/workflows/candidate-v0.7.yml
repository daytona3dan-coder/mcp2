name: MCP2 v0.8 draft reconciliation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - candidate/v0.8-reconciliation

permissions:
  contents: read

jobs:
  draft-v0-8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate v0.8 draft manifest and boundaries
        run: node --test candidate/protocol-freeze.test.mjs
      - name: Run predecessor + v0.8 clean-room tests
        run: node --test reference/clean-room/test.mjs
      - name: Run reference verifier tests
        run: node --test reference/test/*.test.js
      - name: Run draft reference vectors
        run: node reference/src/run-vectors.js
      - name: Cross-check v0.8 vectors with independent clean-room verifier
        run: node reference/clean-room/v08-run-vectors.mjs
      - name: Reconstruct frozen conformance vectors
        run: node reference/clean-room/run-vectors.mjs
      - name: Re-bind closed proof evidence
        run: node reference/clean-room/evidence-bindings.mjs
