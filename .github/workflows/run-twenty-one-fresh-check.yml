name: MCP2 Run Twenty-One fresh external timestamp check

on:
  push:
    branches: [main]
    paths:
      - 'reference/run-twenty-one-fresh-check.mjs'
      - '.github/workflows/run-twenty-one-fresh-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconstruct external timestamp provenance from public GitHub
        run: node reference/run-twenty-one-fresh-check.mjs
